[project]
name = "tfw"
version = "0.1.0"
description = "Reusable Python test automation framework"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

allure = [
    "allure-pytest>=2.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfw"]

[tool.pytest.ini_options]
testpaths = ["tests"]